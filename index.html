function compressImage(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onPhotoPicked(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const kind = session.photoFor;
    const src = await compressImage(f, kind === 'evo' ? 640 : 480);
    if (kind === 'proof') { session.wf = session.wf || { type: null, min: 60, full: true, feel: 'ok' }; session.wf.proof = src; }
    else if (kind === 'scale') { session.wgf = session.wgf || {}; session.wgf.proof = src; }
    else if (kind === 'evo') { const p = me(); p.photos = (p.photos || []).filter(x => x.date !== T()).concat([{ date: T(), src }]); save(); toast('Foto de evolução salva. Só você vê.', 'violet', '📸'); }
    renderMain(true);
  } catch (err) { toast('Não consegui abrir essa imagem. Tente outra.', 'red', '📸'); }
}

/* ---------- Roleta ---------- */
function openSpin() {
  const d = dget(me(), T());
  openSheet(`<h2>Roleta diária</h2><div class="sub">Uma vez por dia. Boa sorte!</div>
    <div class="wheel-box">${pointerSVG}${wheelSVG()}</div>
    <div id="spinArea">${d.spin ? `<div class="pill green" style="font-size:15px">Hoje você já ganhou ${esc(d.spin.label)}.</div>${(me().extraSpins || 0) > 0 ? `<button class="btn gold" data-act="spin-extra" style="margin-top:12px">Usar giro extra (${me().extraSpins})</button>` : ''}` : `<button class="btn gold" data-act="spin-go">Girar!</button>`}</div>`, { center: true, sticky: true });
}
function spinGo() {
  const p = me(), t = T();
  if (session.wheelBusy || dget(p, t).spin) return;
  session.wheelBusy = true;
  const tot = WHEEL.reduce((a, w) => a + w.w, 0); let r = Math.random() * tot, i = 0;
  for (; i < WHEEL.length; i++) { r -= WHEEL[i].w; if (r <= 0) break; }
  i = Math.min(i, WHEEL.length - 1);
  const seg = 360 / WHEEL.length; const jitter = (Math.random() - .5) * seg * .6;
  const rot = 360 * 6 - ((i + .5) * seg) + jitter;
  const wh = $('#wheel'); if (wh) wh.style.transform = `rotate(${rot}deg)`;
  const area = $('#spinArea'); if (area) area.innerHTML = '<div class="sub" style="font-weight:800">Girando...</div>';
  let ticks = 0; const tk = setInterval(() => { sfx('spin'); if (++ticks > 14) clearInterval(tk); }, 180);
  setTimeout(() => {
    clearInterval(tk);
    const w = WHEEL[i]; let label = w.label;
    const d = dmut(p, t);
    if (w.t === 'coins') p.coins += w.v;
    else if (w.t === 'xp') p.bonus = (p.bonus || []).concat([{ date: t, xp: w.v, why: 'Roleta diária' }]);
    else if (w.t === 'freeze') p.freezes = (p.freezes || 0) + 1;
    else if (w.t === 'acc') {
      const free = SHOP.filter(s => s.slot && !(p.owned || []).includes(s.id));
      if (free.length) { const it = free[Math.floor(Math.random() * free.length)]; p.owned = (p.owned || []).concat(it.id); p.equip[it.slot] = it.id; label = 'Acessório raro: ' + it.name; }
      else { p.coins += 50; label = '50 moedas (você já tem todos os acessórios)'; }
    }
    d.spin = { label, i };
    session.wheelBusy = false;
    const ar = $('#spinArea');
    if (ar) ar.innerHTML = `<div class="big-num" style="font-size:30px;color:var(--violet)">${esc(label)}</div><div class="sub" style="margin:4px 0 14px">Prêmio guardado! Volte amanhã.</div><button class="btn" data-act="close">Oba!</button>`;
    confetti(80); sfx('level');
    commit();
  }, 4400);
}
</script>

let STORY = null;
function openRetro() {
  const p = me(), t = T(); const start = S.room.start;

  for (const s of range(start, t)) { const d = dget(p, s); agua += d.water || 0; if (d.workout) { treinos++; min += d.workout.min || 0; } if (planDay(d)) plano++; }

  const kg = Math.max(0, startW(p) - latestW(p, t)); const pct = Math.max(0, pctLost(p, t));

  const hist = multi ? weekHistory() : []; const rv = rivals()[0];
  const wA = hist.filter(x => x.winner && x.winner.id === p.id).length, wB = rv ? hist.filter(x => x.winner && x.winner.id === rv.id).length : 0;

      { bg: '#58A700', k: 'Dias dentro do plano', h: String(plano), c: 'Cada prato no plano virou XP.' },
      { bg: '#CE82FF', k: 'Na balança', h: '−' + fmt1(kg) + ' kg', c: `${fmt1(pct)}% do seu peso inicial. Esse número é só seu.` },
      { bg: '#FF4B4B', k: 'Maior sequência', h: '🔥 ' + st.best, c: `${plural(st.best, 'dia', 'dias')} seguidos sem largar o foguinho.` },
      ...(multi && hist.length ? [{ bg: '#1899D6', k: 'Semanas vencidas', h: `${wA} x ${wB}`, c: `${esc(p.name)} ${wA} x ${wB} ${esc(rv.name)} no placar de semanas.` }] : []),
      { bg: '#E5A500', k: 'Seu companheiro', pet: true, c: `${esc(petOf(p).name)} chegou ao estágio ${STAGES[stageOf(lv)]}, no nível ${esc(levelName(lv))}.` },

  drawStory(); confetti(60); sfx('level');
}
function drawStory() {
  const el = $('#story'); if (!el || !STORY) return;

  const extra = days.filter(s => dget(p, s).workout && !plan.includes(s)).length;
  const crono = plan.length ? clamp((planDone + extra) / plan.length * 100, 0, 100) : null;
  const act = days.filter(s => isActive(p, s) || zIsFree(p, s)).length; const cons = days.length ? act / days.length * 100 : null;

let ZAC = null, ZOUT = null;

}

  }
  return r;
};
Object.assign(ACT, {
  'z11-test': async () => {
    const LN = zLN(); if (!LN) return;
    try {
      await LN.schedule({ notifications: [{ id: 9998, title: 'Teste do Zenit ⏰', body: 'Chegou com o app fechado! Seus lembretes vão funcionar.', schedule: { at: new Date(Date.now() + 60000), allowWhileIdle: true } }] });
      toast('Agora feche o app e bloqueie a tela. Em 1 minuto o aviso tem que chegar.', 'green', '⏰');
    } catch (e) { toast('Não consegui agendar o teste. Confira se as notificações estão ligadas.', 'red', '⏰'); }
  },
  'z11-resched': async () => { toast('Reagendando seus avisos…', 'violet', '🔔'); await zScheduleNative(); setTimeout(z11Panel, 200); toast('Pronto! Avisos das próximas 3 semanas agendados.', 'green', '🔔'); }
});
// Agenda tudo de novo agora, com o jeito novo
setTimeout(() => { try { if (zLN() && S && session.pid) zScheduleNative(); } catch (e) { } }, 2500);
ZNEWS.unshift(['🔔', 'Lembretes reformulados', 'Os avisos agora são agendados com dia e hora exatos para as próximas 3 semanas. Em Lembretes dá para ver os próximos avisos e testar com o app fechado.']);
</script>
