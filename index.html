<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zenit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zenit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --surface-2:#F7F7F7; --line:#E5E5E5; --ink:#3C3C3C; --ink-2:#777777; --ink-3:#AFAFAF;
  --green:#58CC02; --green-d:#58A700; --green-soft:#D7FFB8; --green-line:#A5ED6E;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-soft:#DDF4FF; --blue-line:#84D8FF;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-soft:#FFDFE0; --red-line:#FFB2B2;
  --gold:#FFC800; --gold-d:#E5A500; --gold-soft:#FFF5D3; --gold-text:#D99A00;
  --orange:#FF9600; --orange-d:#E07F00; --orange-soft:#FFEFD6;
  --purple:#CE82FF; --purple-d:#A568CC; --purple-soft:#F6E9FF;
  --glass:#EEF9FF; --face:#253642; --qtext:#777777;
  /* nomes antigos, usados nos relatórios */
  --surface:var(--card); --violet:var(--purple); --violet-d:var(--purple-d); --violet-soft:var(--purple-soft);
  --water:var(--blue); --water-d:var(--blue-d); --water-soft:var(--blue-soft);
  --fire:var(--orange); --fire-d:var(--orange-d); --fire-soft:var(--orange-soft);
  --font:'Nunito', 'Arial Rounded MT Bold', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131F24; --card:#131F24; --surface-2:#1C2B32; --line:#37464F; --ink:#F1F7FB; --ink-2:#A1B1B8; --ink-3:#52656D;
    --green-soft:#1E3A0F; --green-line:#3F6E1B; --blue-soft:#10303F; --blue-line:#1F5A78; --red-soft:#3F1A1C; --red-line:#7A2A2E;
    --gold-soft:#3A3212; --gold-text:#FFC800; --orange-soft:#3D2A10; --purple-soft:#2F2140;
    --glass:#16323F; --face:#E3F5FF; --qtext:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131F24; --card:#131F24; --surface-2:#1C2B32; --line:#37464F; --ink:#F1F7FB; --ink-2:#A1B1B8; --ink-3:#52656D;
  --green-soft:#1E3A0F; --green-line:#3F6E1B; --blue-soft:#10303F; --blue-line:#1F5A78; --red-soft:#3F1A1C; --red-line:#7A2A2E;
  --gold-soft:#3A3212; --gold-text:#FFC800; --orange-soft:#3D2A10; --purple-soft:#2F2140;
  --glass:#16323F; --face:#E3F5FF; --qtext:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;font-size:16px;line-height:1.4;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:14px}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto}

/* ---------- Barra do topo ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg);height:62px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 12px;border-bottom:2px solid var(--line)}
.tb{display:flex;align-items:center;gap:5px;font-weight:800;font-size:17px;padding:6px 7px;border-radius:12px}
.tb svg{width:28px;height:28px;flex:none}
.tb:active{background:var(--surface-2)}
.tb.fire{color:var(--orange)} .tb.fire.off{color:var(--ink-3)} .tb.fire.off svg{filter:grayscale(1);opacity:.55}
.tb.coin{color:var(--gold-text)} .tb.xp{color:var(--gold-text)}
.tb .av{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--surface-2)}
.tb .av svg{width:34px;height:34px}
.demo-strip{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold-text);font-size:13px;font-weight:800;padding:7px 12px;text-align:center}

/* ---------- Navegação ---------- */
main{padding:0 16px calc(100px + env(safe-area-inset-bottom, 0px))}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;z-index:40;background:var(--bg);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom, 0px))}
.nav button{height:54px;display:grid;place-items:center;border-radius:14px;border:2px solid transparent;position:relative}
.nav button svg{width:34px;height:34px}
.nav button.on{border-color:var(--blue-line);background:var(--blue-soft)}
.nav .dot{position:absolute;top:5px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

/* ---------- Tipografia ---------- */
h1,h2,h3,h4{font-weight:800;line-height:1.2}
.h-page{font-size:26px;font-weight:900;margin:20px 2px 2px}
.h2{font-size:22px;font-weight:900;margin:28px 2px 10px}
.sub{color:var(--ink-2);font-size:15px;font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.big-num{font-weight:900;font-size:40px;line-height:1}
.hint{font-size:13px;color:var(--ink-2);margin-top:8px;font-weight:700}
.up{text-transform:uppercase;letter-spacing:.7px}

/* ---------- Botões 3D ---------- */
.btn{--c:var(--green);--s:var(--green-d);--t:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;border-radius:16px;background:var(--c);color:var(--t);box-shadow:0 4px 0 var(--s);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.8px;transition:transform .06s ease, box-shadow .06s ease, filter .12s;margin-bottom:4px;user-select:none;line-height:1.15}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--s)}
.btn.blue{--c:var(--blue);--s:var(--blue-d)}
.btn.red{--c:var(--red);--s:var(--red-d)}
.btn.gold{--c:var(--gold);--s:var(--gold-d)}
.btn.orange{--c:var(--orange);--s:var(--orange-d)}
.btn.purple{--c:var(--purple);--s:var(--purple-d)}
.btn.sec{--c:var(--card);--s:var(--line);--t:var(--blue);border:2px solid var(--line)}
.btn.gray{--c:var(--card);--s:var(--line);--t:var(--ink-3);border:2px solid var(--line)}
.btn.white{--c:#fff;--s:rgba(0,0,0,.2);--t:var(--green)}
.btn[disabled]{--c:var(--line);--s:var(--line);--t:var(--ink-3);cursor:default;box-shadow:none;filter:none}
.btn[disabled]:active{transform:none}
.btn.sm{min-height:42px;font-size:14px;padding:8px 12px;border-radius:14px}
.btn.xs{min-height:36px;font-size:13px;padding:6px 12px;border-radius:12px;width:auto;box-shadow:0 3px 0 var(--s)}
.btn.xs:active{transform:translateY(3px)}
.link-btn{color:var(--blue);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.6px;padding:8px 4px}

/* ---------- Cartões ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;position:relative}
.card h3{font-size:20px;font-weight:800}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card.tint-violet{background:var(--purple-soft);border-color:transparent}
.card.tint-gold{background:var(--gold-soft);border-color:transparent}
.card.tint-water{background:var(--blue-soft);border-color:transparent}
.card.tint-fire{background:var(--orange-soft);border-color:transparent}
.card.tint-green{background:var(--green-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.divider{height:2px;background:var(--line);margin:14px 0;border-radius:2px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--ink-2)}
.pill.green{background:var(--green-soft);color:var(--green-d)} .pill.red{background:var(--red-soft);color:var(--red-d)} .pill.gold{background:var(--gold-soft);color:var(--gold-text)} .pill.violet{background:var(--purple-soft);color:var(--purple-d)} .pill.blue{background:var(--blue-soft);color:var(--blue-d)}
.alert{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--red-soft);color:var(--ink);font-weight:700;font-size:14px;margin-top:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}
.tile .v{font-weight:900;font-size:24px;line-height:1.1}
.tile .k{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:2px}
.tile.c-water .v{color:var(--blue)} .tile.c-fire .v{color:var(--orange)} .tile.c-green .v{color:var(--green)} .tile.c-violet .v{color:var(--purple-d)} .tile.c-gold .v{color:var(--gold-text)}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table td,.table th{padding:9px 6px;border-bottom:2px solid var(--line);text-align:left}
.table th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px}
.table td:not(:first-child),.table th:not(:first-child){text-align:right}

/* ---------- Barras de progresso ---------- */
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width 1s cubic-bezier(.3,1.2,.5,1);position:relative;min-width:0}
.bar > i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.bar.gold > i{background:var(--gold)} .bar.water > i{background:var(--blue)} .bar.red > i{background:var(--red)} .bar.orange > i{background:var(--orange)} .bar.purple > i{background:var(--purple)}

/* ---------- Trilha (página inicial) ---------- */
.unit{position:relative;padding-bottom:12px}
.unit-banner{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 72px);z-index:6;margin:14px 0 0;border-radius:16px;color:#fff;display:flex;align-items:stretch;overflow:hidden;background:var(--uc);box-shadow:0 4px 0 var(--ud)}
.unit-banner .ub-main{flex:1;padding:14px 16px;min-width:0}
.ub-k{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
.ub-t{font-size:19px;font-weight:800;line-height:1.2;margin-top:2px}
.ub-btn{width:66px;display:grid;place-items:center;border-left:2px solid rgba(0,0,0,.14)}
.ub-btn svg{width:32px;height:32px}
.ub-btn:active{background:rgba(0,0,0,.08)}
.path{position:relative;padding:34px 0 8px}
.prow{position:relative;height:96px}
.pnode{--x:0px;position:absolute;left:50%;top:14px;width:72px;height:64px;margin-left:-36px;border-radius:50%;background:var(--nc);box-shadow:0 8px 0 var(--nd);display:grid;place-items:center;transform:translateX(var(--x));transition:transform .06s, box-shadow .06s;z-index:2}
.pnode:active{transform:translateX(var(--x)) translateY(6px);box-shadow:0 2px 0 var(--nd)}
.pnode svg{width:36px;height:36px}
.pnode.locked{--nc:var(--line);--nd:#CECECE}
:root[data-theme="dark"] .pnode.locked{--nd:#2A3840}
.pnode.big{width:78px;height:70px;margin-left:-39px;top:11px}
.pring{position:absolute;left:50%;top:-3px;width:104px;height:104px;margin-left:-52px;transform:translateX(var(--x));z-index:1;pointer-events:none}
.tip{position:absolute;left:50%;top:-32px;z-index:4;transform:translateX(calc(-50% + var(--x)));background:var(--card);border:2px solid var(--line);color:var(--tc);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.6px;padding:8px 13px;border-radius:12px;white-space:nowrap;animation:bob 1.3s ease-in-out infinite;pointer-events:none}
.tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
.pchar{position:absolute;top:-6px;width:118px;z-index:1}
.pchar .say{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);width:150px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 9px;font-size:12.5px;font-weight:800;line-height:1.25;text-align:center}
.chest-node{position:absolute;left:50%;top:6px;width:84px;margin-left:-42px;transform:translateX(var(--x));z-index:2}
.chest-node.ready{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:translateX(var(--x)) rotate(0)}84%{transform:translateX(var(--x)) rotate(-7deg)}88%{transform:translateX(var(--x)) rotate(7deg)}92%{transform:translateX(var(--x)) rotate(-4deg)}96%{transform:translateX(var(--x)) rotate(3deg)}}
.boss-node{position:absolute;left:50%;top:0;width:116px;margin-left:-58px;z-index:2}
.pop-wrap{position:relative;z-index:9;padding:2px 0 22px}
.pop{position:relative;left:50%;width:min(330px, 88vw);transform:translateX(-50%);background:var(--pc);color:#fff;border-radius:16px;padding:16px;animation:popin .16s ease-out both}
.pop.light{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--x));width:18px;height:18px;margin-left:-9px;background:inherit;transform:rotate(45deg);border-radius:3px}
.pop.light::before{border-left:2px solid var(--line);border-top:2px solid var(--line);top:-10px}
.pop h4{font-size:19px;font-weight:900}
.pop p{font-size:15px;font-weight:700;opacity:.92;margin:4px 0 12px}
@keyframes popin{from{opacity:0;transform:translateX(-50%) scale(.92)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.today-fab{position:fixed;right:max(16px, calc(50% - 244px));bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:35;width:56px;height:56px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.today-fab svg{width:28px;height:28px}

/* ---------- Check-in (estilo lição) ---------- */
.ck{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);animation:fadein .2s both}
.ck-in{width:100%;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.ck-head{display:flex;align-items:center;gap:14px;padding:14px 16px}
.ck-x{width:38px;height:38px;display:grid;place-items:center;color:var(--ink-3)}
.ck-bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.ck-bar i{display:block;height:100%;background:var(--green);border-radius:99px;position:relative;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.ck-bar i::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.ck-body{flex:1;overflow-y:auto;padding:4px 18px 20px}
.ck-title{font-size:24px;font-weight:900;margin:6px 0 16px;line-height:1.2}
.ck-say{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.ck-say .m{width:84px;flex:none}
.ck-say .b{position:relative;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:16px;margin-bottom:20px}
.ck-say .b::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.ck-foot{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom, 0px));transition:background .2s}
.ck-foot.good{background:var(--green-soft);border-color:transparent}
.ck-foot.info{background:var(--blue-soft);border-color:transparent}
.ck-foot .fb{display:flex;align-items:center;gap:12px;font-weight:900;font-size:21px;margin-bottom:14px;animation:fbin .3s cubic-bezier(.2,1.4,.4,1) both}
.ck-foot.good .fb{color:var(--green-d)} .ck-foot.info .fb{color:var(--blue-d)}
.ck-foot .fb .ic{width:46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.ck-foot .fb small{display:block;font-size:14px;font-weight:800;opacity:.85}
@keyframes fbin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--card);font-weight:800;font-size:17px;text-align:left;transition:background .1s}
.opt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt .oi{font-size:26px;line-height:1}
.opt.sel{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-d)}
.opt.ok{border-color:var(--green-line);background:var(--green-soft);color:var(--green-d)}
.opt.no{border-color:var(--red-line);background:var(--red-soft);color:var(--red-d)}
.opt.center{justify-content:center;text-align:center;flex-direction:column;gap:4px}
.meal-q{border:2px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.meal-q .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.meal-q .mh .e{font-size:28px}
.meal-q .mh b{font-size:18px;font-weight:900;display:block}
.meal-q .mh span{font-size:13px;color:var(--ink-2);font-weight:700}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.rc{border:2px solid var(--rc);border-radius:16px;overflow:hidden;text-align:center;background:var(--rc);animation:fbin .5s both}
.rc .rh{color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:5px 2px}
.rc .rv{background:var(--bg);border-radius:13px;padding:12px 4px;font-size:22px;font-weight:900;color:var(--rc);display:flex;align-items:center;justify-content:center;gap:4px}
.rc .rv svg{width:22px;height:22px}
.streak-big{display:flex;flex-direction:column;align-items:center;text-align:center}
.streak-big .fl{width:170px;animation:flamein .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes flamein{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.streak-big .n{font-size:100px;font-weight:900;color:var(--orange);line-height:.9;margin-top:4px}
.streak-big .l{font-size:24px;font-weight:900;color:var(--orange)}
.weekrow{display:flex;justify-content:center;gap:8px;margin-top:22px;padding:14px;border:2px solid var(--line);border-radius:18px}
.weekrow div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink-3)}
.weekrow i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.weekrow i svg{width:18px;height:18px}
.weekrow .on{color:var(--orange)} .weekrow .on i{background:var(--orange)}
.weekrow .fz i{background:var(--blue)}
.weekrow .td i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--orange)}

/* ---------- Garrafa ---------- */
.bottle-stage{position:relative;display:flex;justify-content:center;align-items:flex-end;padding-top:6px}
.bottle-svg{width:170px;height:auto;overflow:visible;transform-origin:50% 95%}
.bottle-svg.wobble{animation:wobble .7s ease}
@keyframes wobble{0%{transform:rotate(0)}20%{transform:rotate(-5deg) scale(1.02,.98)}45%{transform:rotate(4deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.bottle-svg.party{animation:party .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes party{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.water-lvl{transition:transform 1.1s cubic-bezier(.25,1.35,.45,1)}
.wave1{animation:wave 2.2s linear infinite}
.wave2{animation:wave 3.4s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.bub{animation:rise 3.2s ease-in infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-150px);opacity:0}}
.bcap{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:0% 100%}
.bcap.open{transform:translate(46px,-18px) rotate(34deg)}
.fall{animation:fall2 .75s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fall2{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--fall));opacity:.9}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple .7s ease-out forwards}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(2.4);opacity:0}}
.water-read{text-align:center;margin-top:10px}
.water-read .n{font-size:46px;font-weight:900;color:var(--blue);line-height:1}
.water-read .g{font-size:18px;font-weight:800;color:var(--ink-3)}
.water-read .m{font-size:15px;font-weight:800;color:var(--ink-2);margin-top:6px}
.cups{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px auto 4px;max-width:100%}
.cups svg{width:20px;height:26px}
.cups .pop1{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.add-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.add-row .btn{flex-direction:column;gap:2px;min-height:74px;padding:8px 6px;font-size:14px}
.add-row .btn .e{font-size:24px;line-height:1}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ---------- Registrar: abas internas ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:16px}
.seg button{padding:10px 4px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:14px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.seg button.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-d)}
.field{display:block;margin-top:12px}
.field > span{display:block;font-weight:800;font-size:14px;margin-bottom:6px;color:var(--ink-2)}
.input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:800;outline:none}
.input:focus{border-color:var(--blue-line);background:var(--card)}
textarea.input{min-height:74px;resize:vertical;font-weight:700;font-size:15px}
.mini{display:block}
.mini small{display:block;font-weight:800;font-size:12px;color:var(--ink-2);margin:0 0 4px 2px}
.mini .input{padding:10px;font-size:16px}
.big-input{display:flex;align-items:baseline;justify-content:center;gap:8px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px}
.big-input input{width:170px;border:0;background:none;outline:none;font-size:52px;font-weight:900;text-align:center;color:var(--ink)}
.big-input span{font-size:24px;font-weight:900;color:var(--ink-3)}
.big-input input::placeholder{color:var(--ink-3);opacity:.45}
.chips.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips.five .chip{justify-content:center;padding:8px 2px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:8px 13px;font-weight:800;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-d)}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.switch{position:relative;width:54px;height:32px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.switch.on{background:var(--green)} .switch.on i{left:26px}

/* ---------- Missões ---------- */
.quest-hero{display:flex;align-items:center;gap:14px;background:var(--purple);color:#fff;border-radius:16px;padding:16px;margin-top:16px;box-shadow:0 4px 0 var(--purple-d)}
.quest-hero .m{width:78px;flex:none}
.quest-hero h2{font-size:21px;font-weight:900}
.quest-hero p{font-weight:700;opacity:.95;font-size:14.5px;margin-top:2px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 4px}
.qhead h2{font-size:22px;font-weight:900}
.qhead .t{display:flex;align-items:center;gap:6px;color:var(--orange);font-weight:800;font-size:15px}
.quests{border:2px solid var(--line);border-radius:16px;padding:0 16px}
.quest{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:2px solid var(--line);width:100%;text-align:left}
.quest:last-child{border-bottom:0}
.quest .qi{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:30px}
.quest .qt{font-size:17px;font-weight:800}
.qbar{position:relative;height:20px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:99px;transition:width .9s cubic-bezier(.3,1.2,.5,1)}
.qbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.qbar span{position:relative;display:block;text-align:center;font-size:12.5px;line-height:20px;font-weight:900;color:var(--qtext)}
:root[data-theme="dark"] .qbar span{text-shadow:0 1px 2px rgba(0,0,0,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qbar span{text-shadow:0 1px 2px rgba(0,0,0,.45)}}
.quest .qc{width:44px;flex:none}

/* ---------- Placar ---------- */
.lb-hero{text-align:center;padding:14px 0 6px}
.lb-hero .sh{width:92px;margin:0 auto}
.lb-hero h1{font-size:26px;font-weight:900;margin-top:6px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-top:4px}
.lb-row.me{background:var(--surface-2)}
.lb-pos{width:34px;text-align:center;font-weight:900;font-size:18px;color:var(--ink-2);flex:none}
.lb-pos svg{width:30px;height:30px}
.lb-av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--surface-2)}
.lb-av svg{width:50px;height:50px}
.lb-nm{font-size:17px;font-weight:800}
.lb-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.lb-xp{font-weight:800;font-size:16px;color:var(--ink-2);white-space:nowrap}

/* ---------- Perfil ---------- */
.prof-hero{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--blue-soft);border-radius:0 0 26px 26px;margin:0 -16px;padding:16px 16px 18px;position:relative}
.prof-hero .pet{width:150px}
.prof-hero h1{font-size:26px;font-weight:900}
.prof-hero .gear{position:absolute;right:14px;top:12px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--blue-d)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.st .si{width:28px;flex:none;font-size:24px;line-height:1.1}
.st .si svg{width:26px;height:26px}
.st .v{font-size:19px;font-weight:900;line-height:1.15}
.st .k{font-size:13px;color:var(--ink-2);font-weight:700}
.achl{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.achl:last-child{border-bottom:0}
.achl .badge{width:64px;height:70px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:32px;background:var(--ac);box-shadow:0 5px 0 var(--acd);position:relative}

.achl .at{font-size:17px;font-weight:800}
.achl .ad{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}

.shop-item:last-child{border-bottom:0}
.shop-item .pv{width:66px;height:66px;border-radius:16px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden}
.pet-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pet-pick button{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 4px;background:var(--card);display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:15px}
.pet-pick button.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-d)}
.pet-pick svg{width:78px;height:78px}

/* ---------- Mascotes ---------- */
.narr{display:flex;gap:10px;align-items:flex-start}
.narr .faisca{width:58px;height:58px;flex:none}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.narr .bubble::after{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.pet-bounce{animation:bounce 1.6s ease-in-out infinite;transform-origin:50% 90%}
.pet-idle{animation:breathe 3s ease-in-out infinite;transform-origin:50% 90%}
.pet-sad{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-9px) scale(.98,1.03)}60%{transform:translateY(0) scale(1.04,.96)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,.985)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}

/* ---------- Gráficos ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-weight:800;fill:var(--ink-3)}
.chart .val{fill:var(--ink);font-weight:900}
.bar-grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{animation:fadein .9s ease both .5s}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- Janelas ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s both}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom, 0px));max-height:92%;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.25,1.05) both;position:relative}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top, 0px))}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet .x{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top, 0px));width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.sheet:not(.full) .x{top:12px}
.sheet h2{font-size:24px;font-weight:900;padding-right:44px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.center-modal{align-items:center;padding:20px}
.center-modal .sheet{border-radius:24px;max-height:90%;text-align:center;padding-bottom:22px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top, 0px) + 70px);z-index:90;width:min(440px, 92vw);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:15px;animation:toastin .35s cubic-bezier(.2,.9,.25,1.2) both}
.toast .ti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:var(--tc, var(--green));color:#fff}
.toast.out{animation:toastout .3s both}
@keyframes toastin{from{transform:translateY(-24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateY(-16px);opacity:0}}
.xp-float{position:fixed;z-index:95;font-weight:900;font-size:22px;color:var(--gold-text);pointer-events:none;animation:floatup 1.3s ease-out forwards;text-shadow:0 2px 0 var(--bg)}
.xp-float.coin{color:var(--gold-text)}
@keyframes floatup{0%{transform:translateY(10px) scale(.7);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- Entrada ---------- */
.screen{min-height:calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));min-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;max-width:520px;margin:0 auto}
.logo{font-size:44px;font-weight:900;color:var(--green);letter-spacing:-.5px;line-height:1}
.tagline{font-size:20px;font-weight:800;color:var(--ink-2);margin-top:12px;max-width:320px;line-height:1.3}
.who{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.who button{border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:10px 12px 8px;background:var(--card);font-weight:800;font-size:17px;width:132px}
.who button.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-d)}
.who svg{width:86px;height:86px}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 8px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);transition:.15s}
.dots i.on{background:var(--green);border-color:var(--green);transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:12px;justify-content:center;margin-top:10px}
.keypad button{height:64px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;font-weight:900;font-size:28px;color:var(--ink)}
.keypad button:active{transform:translateY(3px);border-bottom-width:2px}
.ob{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);background:var(--bg)}

/* ---------- Roleta ---------- */
.wheel-box{position:relative;width:280px;height:280px;margin:14px auto 6px}
.wheel{width:280px;height:280px;transition:transform 4.2s cubic-bezier(.12,.72,.1,1)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:34px;z-index:2}

/* ---------- Retrospectiva ---------- */
.story{position:fixed;inset:0;z-index:88;color:#fff;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));text-align:center;transition:background .5s}
.story .prog{display:flex;gap:5px}
.story .prog i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.story .prog i b{display:block;height:100%;width:0;background:#fff}
.story .prog i.done b{width:100%}
.story .prog i.cur b{animation:storybar 6s linear forwards}

.story .sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.story .huge{font-weight:900;font-size:76px;line-height:.95}
.story .caption{font-weight:800;font-size:19px;max-width:320px}
.story .sx{position:absolute;right:14px;top:calc(26px + env(safe-area-inset-top, 0px));color:#fff;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.18)}
.story .pop-in{animation:pop .6s both}

/* ---------- Diversos ---------- */
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pair figure{border-radius:16px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/4;position:relative;display:grid;place-items:center;border:2px solid var(--line)}
.photo-pair img{width:100%;height:100%;object-fit:cover}
.photo-pair figcaption{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:99px}
.boss-card{background:#2B1E4F;color:#fff;border:none;box-shadow:0 4px 0 #1C1236}
.boss-card .sub,.boss-card .muted{color:rgba(255,255,255,.78)}
.boss-card .bar{background:rgba(255,255,255,.16)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:12px;color:var(--ink-3);font-weight:800}
.cal i{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--ink-2)}
.cal i.on{background:var(--orange);color:#fff}
.cal i.fz{background:var(--blue);color:#fff}
.cal i.td{box-shadow:inset 0 0 0 2px var(--orange)}
.cal i.out{opacity:.35}

/* =================== V3: capa, início, relatórios, domingo =================== */
.xp-float.water{color:var(--blue)}
/* Capa */
.cover{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#58CC02;position:relative;overflow:hidden;max-width:520px;margin:0 auto}
.cover-top{flex:1;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top, 0px) + 26px) 20px 78px;position:relative;color:#fff;text-align:center}
.cover-top.small{flex:none;min-height:0;padding:calc(env(safe-area-inset-top, 0px) + 18px) 20px 34px}
.cover-top.small .logo-wrap{width:104px}
.cover-top.small .wm-a{font-size:12px;letter-spacing:5px}
.cover-top.small .wm-b{font-size:34px;text-shadow:0 4px 0 #46A302}
.dotbg{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 2px, transparent 2.6px);background-size:24px 24px;pointer-events:none}
.cover .fw{position:absolute;width:86px;height:86px;opacity:0;animation:burst 3.4s ease-out infinite;pointer-events:none}
.cover .fw svg{width:100%;height:100%}
@keyframes burst{0%{transform:scale(.15);opacity:0}12%{opacity:1}55%{transform:scale(1);opacity:.95}100%{transform:scale(1.12);opacity:0}}
.logo-wrap{width:188px;position:relative;z-index:1;animation:logoin .9s cubic-bezier(.2,1.4,.4,1) both}
.logo-wrap .logo-badge{display:block;width:100%;height:auto;animation:floaty 3.4s ease-in-out 1s infinite}
@keyframes logoin{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.wm{margin-top:8px;position:relative;z-index:1;animation:fbin .7s .35s both}
.wm-a{display:block;font-size:15px;font-weight:900;letter-spacing:7px;opacity:.95;margin-right:-7px}
.wm-b{display:block;font-size:54px;font-weight:900;line-height:1.02;letter-spacing:-1px;text-shadow:0 5px 0 #46A302}
.cover-chip{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(0,0,0,.14);padding:7px 14px;border-radius:99px;font-weight:900;font-size:14px;animation:fbin .7s .55s both}
.cover-bot{background:var(--bg);border-radius:30px 30px 0 0;padding:44px 20px calc(24px + env(safe-area-inset-bottom, 0px));position:relative;text-align:center}
.cover-bot.pin-bot{flex:1;padding-top:22px}
.cover-pets{position:absolute;left:0;right:0;top:-50px;display:flex;justify-content:center;gap:2px;pointer-events:none}

.cb-t{font-size:20px;font-weight:900;line-height:1.25;max-width:330px;margin:0 auto}

.cb-cd b{color:var(--green);font-weight:900;font-size:17px}
.cb-btns{max-width:380px;margin:22px auto 0;display:grid;gap:12px}
.cb-q{font-size:24px;font-weight:900}
.pin-bot .who{margin-top:12px}
.pin-bot .who button{width:120px;padding:8px 10px 6px}
.pin-bot .who svg{width:70px;height:70px}
.pin-bot .keypad{grid-template-columns:repeat(3,74px);gap:10px}
.pin-bot .keypad button{height:56px;font-size:26px}
.pin-bot .dots{margin:14px 0 6px}
/* Início */
.hello{padding:18px 2px 0}
.hello-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hi{font-size:27px;font-weight:900;line-height:1.15}
.date{font-size:15px;font-weight:800;color:var(--ink-3);margin-top:2px}
.cdown{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--gold-soft);border-radius:18px;padding:12px 14px}
.cd-fw{width:46px;height:46px;flex:none;animation:spin 14s linear infinite}
.cd-fw svg{width:100%;height:100%}

.cd-t{font-size:16px;font-weight:800}
.cd-t b{color:var(--gold-text);font-weight:900;font-size:18px}
.cd-bar{height:10px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px}
.cd-bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width 1.3s cubic-bezier(.3,1.2,.5,1)}
.cd-s{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-top:4px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--bc);color:#fff;box-shadow:0 4px 0 var(--bd);transition:transform .06s, box-shadow .06s}
.banner:active{transform:translateY(4px);box-shadow:0 0 0 var(--bd)}
.banner .b-ic{width:46px;flex:none}
.banner .b-ic svg{width:100%;height:auto}
.banner b{display:block;font-size:17px;font-weight:900}
.banner .grow > span{display:block;font-size:13.5px;font-weight:800;opacity:.95}
.banner .b-go{font-size:34px;font-weight:900;line-height:1;opacity:.9}
.today-card{margin-top:16px;border:2px solid var(--line);border-radius:24px;padding:16px;background:var(--card)}
.today-card.done{border-color:#FFE27A;background:var(--gold-soft)}
.tc-head{display:flex;gap:6px;align-items:center}
.tc-k{font-size:13px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px}
.tc-t{font-size:25px;font-weight:900;line-height:1.15;margin-top:2px}
.tc-seg{display:flex;gap:6px;margin-top:10px;max-width:190px}
.tc-seg i{flex:1;height:12px;border-radius:99px;background:var(--line);transition:background .3s}
.tc-seg i.on{background:var(--green)}
.today-card.done .tc-seg i.on{background:var(--gold)}
.tc-say{font-size:13.5px;font-weight:800;color:var(--ink-2);margin-top:10px;line-height:1.3}
.tc-pet{width:108px;flex:none;margin:-8px -6px -6px 0}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
.mtile{position:relative}
.mt-main{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px 9px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--card);text-align:center}
.mt-main:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.mtile.ok .mt-main{border-color:var(--green-line);background:var(--green-soft)}
.mt-art{width:58px;height:58px;display:grid;place-items:center}
.mt-art svg{width:100%;height:100%}
.mt-t{display:block;font-size:15px;font-weight:900;margin-top:2px}
.mt-v{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.mtile.ok .mt-v{color:var(--green-d)}
.mt-plus{position:absolute;top:-9px;right:-7px;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;font-weight:900;line-height:1;box-shadow:0 3px 0 var(--blue-d);display:grid;place-items:center;border:3px solid var(--bg);padding-bottom:3px}
.mt-plus:active{transform:translateY(3px);box-shadow:0 0 0 var(--blue-d)}
.mt-ok{position:absolute;top:-9px;left:-7px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:3px solid var(--bg);animation:pop .4s both}
.mt-ok svg{width:14px;height:14px}
.mini-bottle{overflow:visible}
.mini-bottle .mb-lvl{transition:transform 1s cubic-bezier(.25,1.35,.45,1)}
.mini-bottle.off{opacity:.35}
.vs{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:10px}
.vs-p{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.vs-av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.vs-av svg{width:64px;height:64px}
.vs-p b{font-size:17px;font-weight:900;margin-top:4px}
.vs-xp{font-size:14px;font-weight:800;color:var(--ink-2)}
.vs-crown{position:absolute;top:-20px;width:36px;z-index:1;animation:bob 1.6s ease-in-out infinite}
.vs-crown svg{width:100%;height:auto}
.vs-mid{font-size:24px;font-weight:900;color:var(--ink-3);align-self:center;margin-bottom:30px;font-style:italic}
.tug{height:16px;border-radius:99px;background:var(--rv);overflow:hidden;margin-top:14px}
.tug i{display:block;height:100%;background:var(--me);transition:width 1.3s cubic-bezier(.3,1.2,.5,1);box-shadow:3px 0 0 var(--bg)}
.vs-cap{text-align:center;font-weight:900;font-size:15px;margin-top:10px;color:var(--ink-2)}
.vs-cap.lead{color:var(--green-d)}
.wstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px}
.wd-l{font-size:12px;font-weight:900;color:var(--ink-3)}
.wd.td .wd-l{color:var(--green-d)}
.wd-n{width:36px;height:36px;border-radius:50%;background:var(--nc);box-shadow:0 4px 0 var(--nd);display:grid;place-items:center;color:#fff}
.wd-n svg{width:20px;height:20px}
.wd-n.k-future,.wd-n.k-pre{background:transparent;box-shadow:none;border:2.5px dashed var(--line)}
.wd-n.k-today{box-shadow:0 4px 0 var(--nd),0 0 0 3px var(--bg),0 0 0 6px var(--nc)}
.wd-n b{font-size:11.5px;font-weight:900}
.wd-c{width:42px;height:40px;display:grid;place-items:center}
.wd-c svg{width:42px;height:auto}
.wd-c.ready{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
/* Trilha em tela própria */
.trail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:fadein .2s both}
.trail-head{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;border-bottom:2px solid var(--line)}
.trail-head b{font-size:18px;font-weight:900}
#trailBody{max-width:520px;margin:0 auto;padding:0 16px 60px}
/* Relatórios */
.sheet.rep{padding-top:0}
.sheet.rep .x{background:rgba(0,0,0,.18);color:#fff;top:calc(12px + env(safe-area-inset-top, 0px));z-index:3}
.rep-hero{margin:0 -16px;padding:calc(env(safe-area-inset-top, 0px) + 24px) 20px 24px;background:var(--hc);color:#fff;border-radius:0 0 30px 30px;position:relative;overflow:hidden;text-align:center}
.rep-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 10% 18%, rgba(255,255,255,.28) 0 6px, transparent 7px),radial-gradient(circle at 88% 26%, rgba(255,255,255,.22) 0 9px, transparent 10px),radial-gradient(circle at 82% 84%, rgba(255,255,255,.18) 0 6px, transparent 7px),radial-gradient(circle at 16% 76%, rgba(255,255,255,.16) 0 10px, transparent 11px),radial-gradient(circle at 60% 8%, rgba(255,255,255,.2) 0 4px, transparent 5px),radial-gradient(circle at 34% 40%, rgba(255,255,255,.12) 0 3px, transparent 4px)}
.rep-k{font-size:13px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;opacity:.92;position:relative}
.rep-t{font-size:27px;font-weight:900;line-height:1.15;margin-top:3px;position:relative}
.rep-art{display:flex;justify-content:center;align-items:flex-end;margin:12px auto 0;height:128px;position:relative}
.rp-pet{width:118px}
.rp-pet svg{width:100%;height:auto}
.rp-medal{width:60px;margin-left:-16px;margin-bottom:6px;animation:bob 1.8s ease-in-out infinite}
.rp-medal svg{width:100%;height:auto}
.stars{display:flex;justify-content:center;gap:4px;margin-top:10px;position:relative}
.stars svg{width:32px;height:32px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rep-verdict{font-size:19px;font-weight:900;margin-top:4px;position:relative}
.rep-big{display:inline-block;font-size:40px;font-weight:900;line-height:1;margin-top:10px;padding:8px 18px;border-radius:18px;background:rgba(0,0,0,.14);position:relative}
.rep-note{font-size:13px;font-weight:800;opacity:.9;margin-top:10px;position:relative}
.rep-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin:26px 2px 10px}
.rep-h .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.rstat{border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:12px;background:var(--card)}
.rstat .ra{width:46px;height:46px}
.rstat .ra svg{width:100%;height:100%}
.rstat .rv{font-size:25px;font-weight:900;line-height:1.1;margin-top:8px}
.rstat .rk{font-size:13px;font-weight:800;color:var(--ink-2);line-height:1.25}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:3px 9px;border-radius:99px;margin-top:8px}
.delta.up{background:var(--green-soft);color:var(--green-d)}
.delta.down{background:var(--red-soft);color:var(--red-d)}
.delta.eq{background:var(--surface-2);color:var(--ink-3)}
.drow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.drow .dc{display:flex;flex-direction:column;align-items:center;gap:3px}
.drow .dc.off{opacity:.35}
.drow .dv{font-size:11.5px;font-weight:900;color:var(--ink-2);min-height:15px}
.drow .dl{font-size:12px;font-weight:900;color:var(--ink-3)}
.drow .dstar{height:16px;width:16px}
.drow .dstar svg{width:16px;height:16px}
.drow .mini-bottle{width:38px;height:auto}
.drow .dumb{width:42px;height:auto}
.drow .plate{width:40px;height:auto}
.cap{font-size:13px;font-weight:800;color:var(--ink-2);margin-top:10px;text-align:center}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.best-day{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-weight:800;font-size:14.5px}
.best-day svg{width:26px;height:auto}
.duel-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.duel-row .dav{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.duel-row .dav svg{width:40px;height:40px}
.duel-row .dn{font-weight:900;font-size:15px;margin-bottom:4px}
.duel-row .dxp{min-width:64px;text-align:right;font-weight:900}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award{border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:12px 8px;text-align:center;background:var(--card)}
.award.win{border-color:#FFE27A;background:var(--gold-soft)}
.award .ai{font-size:30px;line-height:1}
.award .at{font-size:12px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.award .aw{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:16px;font-weight:900}
.award .awa{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.award .awa svg{width:26px;height:26px}
.award .av2{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-top:3px}
.tip-card{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:14.5px;font-weight:700;line-height:1.35}
.tip-card b{font-size:16px;font-weight:900}
.tip-card .tc-ic{font-size:26px;line-height:1;flex:none}
.ach-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px}
.ach-mini{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px}
.ach-mini .badge{width:64px;height:70px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:var(--ac);box-shadow:0 5px 0 var(--acd)}
.ach-mini span{color:var(--gold-text);font-weight:900}
.seg3{display:flex;gap:6px;max-width:220px;margin:16px auto 0}
.seg3 i{flex:1;height:12px;border-radius:99px;background:var(--line)}
.seg3 i.on{background:var(--green)}
.rtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rtile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:10px 4px}
.rtile.ok{border-color:var(--green-line);background:var(--green-soft)}
.rtile svg{width:52px;height:52px}
.rtile b{font-size:14.5px;font-weight:900;margin-top:4px}
.rtile span{font-size:12px;font-weight:800;color:var(--ink-2)}
.meal-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line)}
.meal-line:last-child{border-bottom:0}
.meal-line .ml-i{font-size:24px}
.meal-line b{display:block;font-size:15.5px;font-weight:900}
.meal-line .grow span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ba{display:flex;align-items:center;gap:10px;margin-top:18px}
.ba .bx{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:12px 6px;text-align:center}
.ba .bx span{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.ba .bx b{display:block;font-size:30px;font-weight:900;line-height:1.1;margin:2px 0}
.ba .bx.now{border-color:var(--green-line);background:var(--green-soft)}
.ba .bx.now b{color:var(--green-d)}
.ba-arrow{font-size:26px;color:var(--green);font-weight:900}
.ba-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.cal.hm i.pf{background:var(--gold);color:#fff}
.cal.hm i.ac{background:var(--green);color:#fff}
.cal.hm i.fz{background:var(--blue);color:#fff}
.cal.hm i.ms{background:var(--surface-2);color:var(--ink-3)}
.cal.hm i.td{box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
/* Fechamento de domingo */
.sun-k{font-size:14px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px}
.sun-hero{text-align:center;padding-top:2px}
.sun-d{font-size:14px;font-weight:800;color:var(--ink-3)}
.sun-t{font-size:29px;font-weight:900;line-height:1.15;margin-top:4px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:18px auto 0;max-width:330px}
.pod{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center}
.pcrown{width:46px;height:34px;margin-bottom:-4px;animation:bob 1.6s ease-in-out infinite}
.pcrown svg{width:100%;height:auto}
.pav{width:100px}
.pav svg{width:100%;height:auto}
.pod .pn{font-size:18px;font-weight:900;margin-top:2px}
.pod .px{font-size:14px;font-weight:800;color:var(--ink-2)}
.pod .blk{width:100%;margin-top:8px;border-radius:18px 18px 6px 6px;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:900;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);transform-origin:50% 100%;animation:rise2 .8s cubic-bezier(.2,1.3,.4,1) both}
.pod.first .blk{height:118px;background:var(--gold)}
.pod.second .blk{height:78px;background:#AFBEC6;animation-delay:.18s}
@keyframes rise2{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.craque{display:flex;align-items:center;gap:12px;background:var(--purple);color:#fff;border-radius:20px;padding:12px 14px;margin-top:18px;box-shadow:0 4px 0 var(--purple-d)}
.cq-star{width:54px;flex:none}
.cq-star svg{width:100%;height:auto}
.cq-k{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;opacity:.9}
.cq-t{font-size:22px;font-weight:900;line-height:1.1}
.cq-s{font-size:13.5px;font-weight:800;opacity:.95}
.cq-av{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.cq-av svg{width:46px;height:46px}
.hist{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hist .hp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.hist .hav{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.hist .hav svg{width:52px;height:52px}
.hsc{font-size:46px;font-weight:900;line-height:1;display:flex;align-items:center;gap:10px}
.hsc span{font-size:22px;color:var(--ink-3)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.wchip{font-size:12.5px;font-weight:900;padding:6px 11px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:2px solid transparent}
.wchip:active{transform:translateY(2px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .confetti{display:none}
}

/* ===================== ZENIT · Fase 1 ===================== */
.btn:active,.mtile .mt-main:active,.opt:active,.zr-card button:active,.zq-btn:active{transform:translateY(3px) scale(.985)}
/* ---- Abertura ---- */
#zsplash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1B2A6B 0%,#0B1030 62%,#050818 100%);transition:opacity .5s ease}
#zsplash.out{opacity:0;pointer-events:none}
#zsplash .zs-in{display:flex;flex-direction:column;align-items:center;gap:10px}
#zsplash .zs-logo{width:150px;height:150px}
#zsplash .zs-name{font-weight:900;font-size:40px;letter-spacing:10px;color:#fff;opacity:0;animation:zsName .6s ease 1s forwards;padding-left:10px}
#zsplash .zs-sub{font-weight:800;font-size:12.5px;letter-spacing:3px;color:#FFC23D;opacity:0;animation:zsName .6s ease 1.25s forwards}
@keyframes zsName{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.zl-trail{stroke-dasharray:4 9;stroke-dashoffset:0}
#zsplash .zl-draw{stroke-dasharray:260;stroke-dashoffset:260;animation:zlDraw 1.1s cubic-bezier(.4,0,.2,1) .1s forwards}
@keyframes zlDraw{to{stroke-dashoffset:0}}
#zsplash .zl-star{transform-box:fill-box;transform-origin:center;opacity:0;animation:zlStar .7s cubic-bezier(.2,1.6,.4,1) .9s forwards}
@keyframes zlStar{from{opacity:0;transform:scale(.2) rotate(-60deg)}to{opacity:1;transform:none}}
#zsplash .zl-glow{opacity:0;animation:zsGlow 1.2s ease 1s forwards}
@keyframes zsGlow{to{opacity:1}}
/* ---- Capa ---- */
.cover .logo-wrap.zlogo{width:128px;height:128px;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cover .logo-wrap.zlogo svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.zwm{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px;color:#fff;position:relative}
.zwm b{font-weight:900;font-size:44px;letter-spacing:9px;padding-left:9px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.zwm span{font-weight:900;font-size:11.5px;letter-spacing:3px;opacity:.92}
.cover-top.small .zwm b{font-size:32px}
.cover-top.small .logo-wrap.zlogo{width:92px;height:92px}
/* ---- Tour ---- */
.ztour{position:fixed;inset:0;z-index:60;background:var(--bg,#fff);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));animation:fadeIn .3s ease}
.ztour .zt-top{display:flex;justify-content:space-between;align-items:center}
.ztour .zt-dots{display:flex;gap:6px}.ztour .zt-dots i{width:8px;height:8px;border-radius:9px;background:var(--line,#E5E5E5);transition:all .3s}.ztour .zt-dots i.on{width:24px;background:#58CC02}
.ztour .zt-skip{font-weight:900;color:var(--ink-3,#8A8A8A);background:none;border:0;font-size:15px;padding:8px}
.ztour .zt-art{flex:1;display:grid;place-items:center;min-height:0}
.ztour .zt-art>div{width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center;border-radius:40px;position:relative;animation:ztPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes ztPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ztour h2{font-size:26px;font-weight:900;text-align:center;line-height:1.15;margin:6px 0 8px}
.ztour p{text-align:center;color:var(--ink-3,#777);font-weight:700;font-size:16px;line-height:1.45;margin:0 auto 18px;max-width:340px}
/* ---- Início: céu ---- */
.zhero{position:relative;border-radius:28px;overflow:hidden;margin:4px 0 14px;min-height:198px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.08);isolation:isolate}
.zhero .zh-sky{position:absolute;inset:0;z-index:-2}
.zhero .zh-deco{position:absolute;inset:0;z-index:-1;pointer-events:none}
.zhero .zh-in{display:flex;gap:6px;padding:18px 14px 16px 18px;min-height:198px}
.zhero .zh-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.zhero .zh-hi{font-weight:900;font-size:24px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.zhero .zh-date{font-weight:800;font-size:13.5px;opacity:.92;margin-top:4px}
.zhero .zh-lvl{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.22);border-radius:99px;padding:5px 11px 5px 7px;font-weight:900;font-size:12.5px;align-self:flex-start;backdrop-filter:blur(4px);border:0;color:#fff}
.zhero .zh-lvl i{width:20px;height:20px;border-radius:50%;background:#FFC23D;display:grid;place-items:center;font-style:normal;font-size:11px;color:#6B4A00}
.zhero .zh-cd{margin-top:auto;padding-top:12px}
.zhero .zh-cd b{font-size:15px;font-weight:900}
.zhero .zh-cd span{font-weight:800;font-size:12.5px;opacity:.9}
.zhero .zh-bar{height:9px;border-radius:9px;background:rgba(255,255,255,.28);margin-top:6px;overflow:hidden}
.zhero .zh-bar i{display:block;height:100%;border-radius:9px;background:#FFC23D;transition:width 1.2s cubic-bezier(.3,1,.4,1)}
.zhero .zh-pet{width:132px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:none;border:0;padding:0;cursor:pointer}
.zhero .zh-pet .zp{width:120px;animation:zBob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.zhero .zh-pet.poke .zp{animation:zPoke .6s cubic-bezier(.3,1.6,.5,1)}
.zhero .zh-say{position:absolute;top:0;right:4px;left:-6px;background:#fff;color:#3C3C3C;font-weight:900;font-size:12px;line-height:1.25;border-radius:14px;padding:7px 9px;box-shadow:0 3px 0 rgba(0,0,0,.12);text-align:center;animation:zSay .35s cubic-bezier(.2,1.4,.4,1)}
.zhero .zh-say:after{content:'';position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes zSay{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes zBob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(1.01,.99)}55%{transform:translateY(-5px) scale(.99,1.01)}}
@keyframes zPoke{0%{transform:scale(1,1)}30%{transform:scale(1.18,.82) translateY(4px)}60%{transform:scale(.9,1.12) translateY(-16px)}100%{transform:none}}
.zhero .zh-heart{position:absolute;bottom:70px;left:50%;font-size:22px;animation:zHeart 1s ease forwards;pointer-events:none}
@keyframes zHeart{from{transform:translate(-50%,0) scale(.5);opacity:1}to{transform:translate(-50%,-60px) scale(1.2);opacity:0}}
.zlights{position:absolute;left:-10px;right:-10px;top:0;height:30px}
.zlights i{position:absolute;top:10px;width:9px;height:12px;border-radius:50% 50% 45% 45%;animation:zBulb 1.4s ease-in-out infinite}
@keyframes zBulb{0%,100%{opacity:.55}50%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}}
/* ---- Lembretes no Início ---- */
.zrem{margin:0 0 14px}
.zrem .zr-head{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 8px}
.zrem .zr-head h3{margin:0;font-size:17px;font-weight:900}
.zrem .zr-head button{background:none;border:0;font-weight:900;color:#1CB0F6;font-size:14px;padding:4px}
.zr-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.zr-row::-webkit-scrollbar{display:none}
.zr-card{flex:0 0 76%;max-width:300px;scroll-snap-align:start;background:var(--card,#fff);border:2px solid var(--line,#E5E5E5);border-radius:20px;padding:12px;display:flex;gap:11px;align-items:center;box-shadow:0 3px 0 var(--line,#E5E5E5)}
.zr-card.late{border-color:#FFC23D;box-shadow:0 3px 0 #F5B000}
.zr-card.done{opacity:.55}
.zr-card .zr-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.zr-card .zr-ic svg{width:30px;height:30px}
.zr-card .zr-tx{flex:1;min-width:0}
.zr-card .zr-t{font-weight:900;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zr-card .zr-s{font-weight:700;font-size:12.5px;color:var(--ink-3,#8A8A8A);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zr-card .zr-h{font-weight:900;font-size:12px;margin-top:4px;color:#1CB0F6}
.zr-card.late .zr-h{color:#E5A500}
.zr-card .zr-ok{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line,#E5E5E5);background:var(--card,#fff);display:grid;place-items:center;flex:none;color:#58CC02}
.zr-card.done .zr-ok{background:#58CC02;border-color:#58CC02;color:#fff}
.zr-card .zr-ok svg{width:18px;height:18px}
.zr-empty{background:var(--card,#fff);border:2px dashed var(--line,#E5E5E5);border-radius:20px;padding:14px;font-weight:800;color:var(--ink-3,#8A8A8A);text-align:center;font-size:14px}
.wd .wd-plan{display:block;font-size:9.5px;font-weight:900;color:var(--ink-3,#9A9A9A);margin-top:3px;letter-spacing:.2px;text-transform:uppercase}
.wd .wd-plan.k-free{color:#CE82FF}.wd .wd-plan.k-tr{color:#FF9600}
/* ---- Missões: cartão do mundo ---- */
.zworld{position:relative;border-radius:26px;overflow:hidden;margin:6px 0 16px;color:#fff;box-shadow:0 6px 0 #E07F00;background:#FF9600;border:0;width:100%;text-align:left;padding:0;display:block}
.zworld .zw-art{height:118px;position:relative;overflow:hidden}
.zworld .zw-art svg{position:absolute;inset:0;width:100%;height:100%}
.zworld .zw-body{padding:12px 16px 16px}
.zworld .zw-k{font-weight:900;font-size:12px;letter-spacing:1.5px;opacity:.92}
.zworld .zw-t{font-weight:900;font-size:22px;line-height:1.1;margin-top:2px}
.zworld .zw-s{font-weight:800;font-size:13.5px;opacity:.95;margin-top:4px}
.zworld .zw-bar{height:12px;border-radius:12px;background:rgba(0,0,0,.18);margin-top:10px;overflow:hidden}
.zworld .zw-bar i{display:block;height:100%;background:#FFE17A;border-radius:12px;transition:width 1.2s cubic-bezier(.3,1,.4,1)}
.zworld .zw-go{position:absolute;right:14px;bottom:14px;background:#fff;color:#E07F00;font-weight:900;font-size:14px;border-radius:14px;padding:9px 14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
/* ---- Mapa do mundo ---- */
.zmap{position:fixed;inset:0;z-index:55;background:#FFF8EC;display:flex;flex-direction:column;animation:fadeIn .25s ease}
.zmap.dk{background:#0E1B4D}
.zmap .zm-top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:3;display:flex;gap:8px;align-items:stretch}
.zmap .zm-x{width:48px;border-radius:16px;border:0;background:#fff;color:#3C3C3C;box-shadow:0 4px 0 rgba(0,0,0,.14);display:grid;place-items:center;flex:none}
.zmap .zm-x svg{width:22px;height:22px}
.zmap .zm-chip{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FF9600;color:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 #E07F00;border:0;text-align:left;min-width:0}
.zmap .zm-chip span{display:block;font-size:11.5px;font-weight:800;opacity:.92}
.zmap .zm-chip b{display:block;font-size:19px;font-weight:900;line-height:1.1;white-space:nowrap}
.zmap .zm-th{width:48px;border-radius:16px;border:0;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14);display:grid;place-items:center;flex:none;padding:0}
.zmap .zm-th i{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #E5E5E5}
.zmap .zm-view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(72px + env(safe-area-inset-top,0px)) 0 calc(96px + env(safe-area-inset-bottom,0px))}
.zmap .zm-view>svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.zmap .zm-foot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.12);color:#3C3C3C}
.zmap .zm-foot .grow{flex:1;min-width:0}
.zmap .zm-foot b{display:block;font-weight:900;font-size:15px}
.zmap .zm-foot span{font-weight:800;font-size:12.5px;color:#8A8A8A}
.zmap .zm-foot .zm-bar{height:9px;border-radius:9px;background:#F0F0F0;margin-top:5px;overflow:hidden}
.zmap .zm-foot .zm-bar i{display:block;height:100%;background:#FF9600;border-radius:9px}
.zmap .zm-foot .btn{width:auto;padding:10px 16px;font-size:14px}
.zmap svg [data-act]{cursor:pointer}
.zn-now{animation:zNodePulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes zNodePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* ---- Cartões de nível e mundo ---- */
.zlv-hero{text-align:center;padding:4px 0 6px}
.zlv-badge{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:34px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.zlv-rw{display:flex;align-items:center;gap:10px;background:var(--gold-soft,#FFF5D6);border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:800;font-size:14.5px;color:var(--gold-text,#8A6200)}
.zlv-rw i{font-style:normal;width:30px;height:30px;border-radius:10px;background:#FFC23D;display:grid;place-items:center;flex:none}
.zlv-rw i svg{width:20px;height:20px}
.zlv-rw.locked{filter:grayscale(1);opacity:.7}
.zws{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.zws span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#F0F0F0;color:#AFAFAF}
.zws span.done{background:#FF9600;color:#fff}.zws span.now{background:#fff;border:3px solid #FF9600;color:#E07F00}
.zthemes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.zthemes button{border:2px solid var(--line,#E5E5E5);border-radius:14px;background:var(--card,#fff);padding:6px 6px 8px;font-weight:900;font-size:12px;color:inherit}
.zthemes button.on{border-color:#1CB0F6;box-shadow:0 3px 0 #1899D6}
.zthemes button[disabled]{opacity:.45}
.zthemes button i{display:block;height:44px;border-radius:10px;margin-bottom:6px}
/* ---- Subida de nível de cinema ---- */
.zlvup{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:radial-gradient(ellipse at 50% 38%,#3A2A8A 0%,#140F3A 55%,#07061A 100%);overflow:hidden;animation:fadeIn .35s ease}
.zlvup .zu-rays{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,210,63,.13) 0 10deg,transparent 10deg 20deg);animation:zSpin 18s linear infinite;border-radius:50%;mask:radial-gradient(circle,#000 25%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 25%,transparent 65%)}
@keyframes zSpin{to{transform:rotate(360deg)}}
.zlvup .zu-k{position:relative;font-weight:900;font-size:14px;letter-spacing:5px;color:#FFD23F;animation:zsName .5s ease .2s both}
.zlvup .zu-n{position:relative;font-weight:900;font-size:96px;line-height:1;margin:4px 0;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 40px rgba(255,210,63,.55);animation:zNum .8s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes zNum{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
.zlvup .zu-t{position:relative;font-weight:900;font-size:24px;animation:zsName .5s ease .8s both}
.zlvup .zu-w{position:relative;font-weight:800;font-size:13.5px;opacity:.8;margin-top:2px;animation:zsName .5s ease .9s both}
.zlvup .zu-pet{position:relative;width:170px;margin:14px auto 4px;animation:zPetIn .9s cubic-bezier(.2,1.5,.4,1) 1s both}
.zlvup .zu-pet:before{content:'';position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.55),transparent 65%);animation:zGlowP 2s ease-in-out infinite}
@keyframes zPetIn{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes zGlowP{0%,100%{opacity:.6}50%{opacity:1}}
.zlvup .zu-evo{position:relative;display:inline-block;background:#FFC23D;color:#5A3A00;font-weight:900;border-radius:99px;padding:7px 14px;font-size:14px;animation:zsName .5s ease 1.6s both}
.zlvup .zu-list{position:relative;width:100%;max-width:340px;margin:14px auto 18px;display:flex;flex-direction:column;gap:8px}
.zlvup .zu-list div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;text-align:left;opacity:0;animation:zItem .45s cubic-bezier(.2,1.3,.4,1) both}
.zlvup .zu-list i{font-style:normal;width:30px;height:30px;border-radius:10px;background:#FFC23D;display:grid;place-items:center;flex:none}
.zlvup .zu-list i svg{width:20px;height:20px}
@keyframes zItem{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.zlvup .btn{position:relative;max-width:340px;animation:zsName .5s ease 2.4s both}
.zlvup .zu-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:zFlash .9s ease 1s}
@keyframes zFlash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
/* ---- Rotina, lembretes, agenda ---- */
.zrt{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.zrt-day{border:2px solid var(--line,#E5E5E5);border-radius:16px;padding:10px 10px 10px 12px}
.zrt-day .zd-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zrt-day .zd-h b{font-weight:900;font-size:15px;text-transform:capitalize}
.zrt-day input[type=time]{border:2px solid var(--line,#E5E5E5);border-radius:10px;padding:5px 8px;font:inherit;font-weight:900;font-size:14px;background:var(--card,#fff);color:inherit}
.zchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.zchips button{border:2px solid var(--line,#E5E5E5);background:var(--card,#fff);border-radius:99px;padding:6px 11px;font-weight:900;font-size:13px;color:inherit}
.zchips button.on{background:#DDF4FF;border-color:#1CB0F6;color:#1899D6}
.zchips button.on.k-rest{background:#F3E8FF;border-color:#CE82FF;color:#A560E8}
.zchips button.on.k-leve{background:#E8F9D9;border-color:#58CC02;color:#46A302}
.zrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid var(--line,#F0F0F0)}
.zrow:last-child{border-bottom:0}
.zrow .grow{flex:1;min-width:0}
.zrow b{font-weight:900;font-size:15px;display:block}
.zrow span{font-weight:700;font-size:13px;color:var(--ink-3,#8A8A8A)}
.ztog{width:52px;height:30px;border-radius:30px;background:#E5E5E5;border:0;position:relative;flex:none;transition:background .2s}
.ztog:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .2s}
.ztog.on{background:#58CC02}.ztog.on:after{transform:translateX(22px)}
.zsel{border:2px solid var(--line,#E5E5E5);border-radius:12px;padding:8px 10px;font:inherit;font-weight:900;font-size:14px;background:var(--card,#fff);color:inherit}
.zinput{width:100%;border:2px solid var(--line,#E5E5E5);border-radius:14px;padding:12px;font:inherit;font-weight:800;font-size:15px;background:var(--card,#fff);color:inherit}
.zmini{border:0;background:none;color:#FF4B4B;font-weight:900;font-size:13px;padding:6px}
.zrc{background:linear-gradient(135deg,#1CB0F6,#1899D6);color:#fff;border-radius:22px;padding:14px 16px;margin:6px 0 4px;box-shadow:0 5px 0 #1478AA}
.zrc h3{margin:0;font-size:18px;font-weight:900;color:#fff}
.zrc .zrc-s{font-weight:800;font-size:13.5px;opacity:.95;margin-top:2px}
.zrc .zrc-b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zrc .zrc-b button{background:rgba(255,255,255,.2);border:0;border-radius:14px;color:#fff;font-weight:900;font-size:13px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.zrc .zrc-b svg{width:26px;height:26px}
.zfoot{text-align:center;margin:26px 0 8px;color:var(--ink-3,#AFAFAF);font-weight:800;font-size:12px;user-select:none;-webkit-user-select:none}
.zfoot .zf-logo{width:44px;height:44px;margin:0 auto 4px;cursor:pointer}
/* ---- Porcentagens dos relatórios ---- */
.zpct{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.zpct button{border:2px solid var(--line,#E5E5E5);background:var(--card,#fff);border-radius:18px;padding:10px 6px 10px;text-align:center;color:inherit;box-shadow:0 3px 0 var(--line,#E5E5E5)}
.zpct .zp-ring{width:62px;height:62px;margin:0 auto 4px;position:relative}
.zpct .zp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.zpct .zp-ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px}
.zpct .zp-k{font-weight:900;font-size:11.5px;line-height:1.2}
.zdl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.zdl div{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2,#F7F7F7);border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px}
.zdl div em{font-style:normal;font-weight:900}
.zdl .ok{color:#46A302}.zdl .no{color:#E0483C}.zdl .mid{color:#8A8A8A}
@media (prefers-color-scheme: dark){
  .zmap{background:#0E1B4D}.zmap .zm-x,.zmap .zm-th,.zmap .zm-foot{background:#1E2540;color:#F0F0F0}
  .zmap .zm-foot .zm-bar{background:#2A3355}.zws span{background:#2A3355;color:#6E7596}
}

/* ===================== ZENIT · Início ilustrado (v1.1) ===================== */

let AC = null;
function sfx(kind) {
  if (!S || !S.settings || !S.settings.sound) return;

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {
      ding: [[880, 0, .12], [1320, .09, .2]], coin: [[1320, 0, .08], [1760, .07, .16]],
      level: [[523, 0, .16], [659, .13, .16], [784, .26, .16], [1047, .39, .4]], tick: [[1400, 0, .03]],

/* ---------- Depois de cada ação ---------- */
function snapshot(p) {

  let coinGain = 0; const msgs = []; let dayComplete = false;

    if (missionsDone(p, day) === 3 && !day.coinFlags.all) { day.coinFlags.all = true; p.coins += 10; coinGain += 10; dayComplete = true; }
  }

  const q = [];
  if (opt.modal) q.push(opt.modal);

/* ---------- Água ---------- */
